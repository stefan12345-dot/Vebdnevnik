<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Školski Kutak — demo | Administracija</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#263445;font-family:Arial,sans-serif}header{background:#1a4a75;color:white;padding:18px 24px}header h1{margin:0;font-size:22px}nav{display:flex;gap:8px;padding:0 24px;background:white;border-bottom:1px solid #dce3ea;overflow-x:auto}nav a{padding:15px 16px;color:#4a5568;text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent}nav a:hover,nav a.active{color:#1a4a75;border-bottom-color:#1a4a75}main{max-width:1000px;margin:30px auto;padding:0 20px}h2,h3{color:#1a4a75}.muted{color:#718096}.layout{display:grid;grid-template-columns:210px 1fr;gap:20px;margin-top:22px}.card{padding:20px;background:white;border:1px solid #e2e8f0;border-radius:9px;box-shadow:0 3px 10px rgba(26,74,117,.05)}.category-list{display:grid;gap:7px}.category{padding:11px;text-align:left;background:white;border:1px solid #e2e8f0;border-radius:6px;color:#4a5568;cursor:pointer}.category.active,.category:hover{background:#edf4fa;color:#1a4a75;border-color:#a8c7e0}.form{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.form input,.form select{flex:1;min-width:140px;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}.btn{padding:10px 14px;border:0;border-radius:6px;background:#1a4a75;color:white;cursor:pointer}.btn:hover{background:#123958}.btn.delete{background:#c53030}.list{margin:0;padding:0;list-style:none}.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f4}.list li:last-child{border:0}.delete{padding:6px 9px;border:0;border-radius:4px;color:#a61b1b;background:#fff0f0;cursor:pointer}.notice{padding:12px;background:#fff8e6;border-radius:6px;color:#775b12}.demo{font-size:13px;color:#718096;margin-top:20px}@media(max-width:650px){header{padding:16px}nav{padding:0 6px}nav a{padding:13px 10px}main{padding:0 12px}.layout{grid-template-columns:1fr}.category-list{grid-template-columns:repeat(2,1fr)}}
</style>
<link rel="stylesheet" href="common-header.css">
</head>
<body>
<header class="app-header"><h1 class="app-brand">Školski Kutak · demo</h1><div class="app-selectors"><select id="headerSchool" aria-label="Škola"></select><select id="headerYear" aria-label="Školska godina"></select><select id="headerClass" aria-label="Odeljenje"></select><select id="headerSubject" aria-label="Predmet"></select></div></header>
<nav class="app-nav" aria-label="Glavna navigacija"><a href="dashboard.html">Početna</a><a href="imenik.html">Imenik</a><a href="dnevnik-rada.html">Dnevnik rada</a><a href="raspored.html">Raspored</a><a href="administracija.html" class="active" aria-current="page">Administracija</a></nav>
<main>
<h2>Administracija</h2><p class="muted">Upravljanje školama, predmetima, odeljenjima, korisnicima i učenicima.</p>
<div class="layout"><aside class="card category-list" aria-label="Kategorije"><button class="category active" data-kind="schools">Škole</button><button class="category" data-kind="subjects">Predmeti</button><button class="category" data-kind="classes">Odeljenja</button><button class="category" data-kind="users">Korisnici</button><button class="category" data-kind="students">Učenici</button></aside>
<section class="card"><h3 id="sectionTitle">Škole</h3><p id="sectionHelp" class="muted"></p><form id="addForm" class="form"></form><ul id="items" class="list"></ul></section></div>
<p class="demo">Demo verzija: podaci se čuvaju lokalno u pregledaču i biće povezani sa bazom kada dodamo server.</p>
</main>
<script>
const KEY='ednevnik-demo';let data;try{data=JSON.parse(localStorage.getItem(KEY));}catch(_){};
if(!data||!Array.isArray(data.students))data={students:[{id:'jovana-petrovic',name:'Jovana Petrović',className:'VIII-2',photo:'',grades:[],notes:[],conduct:[],absences:[]},{id:'marko-ilic',name:'Marko Ilić',className:'VIII-2',photo:'',grades:[],notes:[],conduct:[],absences:[]},{id:'milica-jovanovic',name:'Milica Jovanović',className:'VIII-2',photo:'',grades:[],notes:[],conduct:[],absences:[]},{id:'luka-nikolic',name:'Luka Nikolić',className:'VIII-2',photo:'',grades:[],notes:[],conduct:[],absences:[]},{id:'teodora-simic',name:'Teodora Simić',className:'VIII-2',photo:'',grades:[],notes:[],conduct:[],absences:[]},{id:'lazar-otasevic',name:'Lazar Otašević',className:'VIII-2',photo:'',grades:[],notes:[],conduct:[],absences:[]},{id:'lara-tomic',name:'Lara Tomić',className:'VIII-2',photo:'',grades:[],notes:[],conduct:[],absences:[]}],lessons:[],subjects:['Srpski jezik','Matematika','Biologija','Istorija','Engleski jezik','Fizika','Hemija','Geografija'],classes:['VIII-2'],schools:[],users:[]};
data.schools ||= [];data.subjects ||= [];data.classes ||= [];data.users ||= [];data.students ||= [];const save=()=>localStorage.setItem(KEY,JSON.stringify(data));save();
const configs={schools:{title:'Škole',help:'Dodajte i uklonite škole.',fields:[{name:'name',label:'Naziv škole',placeholder:'Npr. OŠ Vuk Karadžić'}]},subjects:{title:'Predmeti',help:'Predmeti se nude pri unosu ocena i časova.',fields:[{name:'name',label:'Naziv predmeta',placeholder:'Npr. Matematika'}]},classes:{title:'Odeljenja',help:'Dodajte odeljenja za organizovanje učenika.',fields:[{name:'name',label:'Oznaka odeljenja',placeholder:'Npr. VIII-2'}]},users:{title:'Korisnici',help:'Unesite osnovne kontakt podatke i podatke za prijavu.',fields:[{name:'name',label:'Ime i prezime',placeholder:'Ime i prezime'},{name:'email',label:'E-pošta',placeholder:'ime@skola.rs',type:'email',required:false},{name:'phone',label:'Telefon',placeholder:'Broj telefona',type:'tel',required:false},{name:'role',label:'Uloga',type:'select',options:['Nastavnik','Administrator']},{name:'username',label:'Korisničko ime',placeholder:'Korisničko ime'},{name:'password',label:'Početna lozinka (min. 8 znakova)',placeholder:'Početna lozinka',type:'password'}]},students:{title:'Učenici',help:'Dodavanje učenika odmah ih prikazuje u imeniku.',fields:[{name:'name',label:'Ime i prezime',placeholder:'Ime i prezime'},{name:'className',label:'Odeljenje',type:'select',options:()=>data.classes.length?data.classes:['VIII-2']}]}};
let current='schools';const form=document.getElementById('addForm'),list=document.getElementById('items');
function render(){const config=configs[current];document.getElementById('sectionTitle').textContent=config.title;document.getElementById('sectionHelp').textContent=config.help;form.replaceChildren();config.fields.forEach(field=>{let input;if(field.type==='select'){input=document.createElement('select');const values=typeof field.options==='function'?field.options():field.options;values.forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;input.appendChild(option);});}else{input=document.createElement('input');input.placeholder=field.placeholder;input.type=field.type||'text';if(field.type==='password')input.minLength=8;}input.name=field.name;input.setAttribute('aria-label',field.label);input.required=field.required!==false;form.appendChild(input);});const add=document.createElement('button');add.type='submit';add.className='btn';add.textContent='Dodaj';form.appendChild(add);list.replaceChildren();const entries=data[current]||[];if(!entries.length){const empty=document.createElement('li');empty.className='muted';empty.textContent='Još nema unetih podataka.';list.appendChild(empty);return;}entries.forEach((entry,index)=>{const li=document.createElement('li');const text=document.createElement('span');text.textContent=current==='students'?`${entry.name} · ${entry.className||''}`:current==='users'?`${entry.name} · ${entry.role} · ${entry.username}`:typeof entry==='string'?entry:entry.name;const remove=document.createElement('button');remove.type='button';remove.className='delete';remove.textContent='Obriši';remove.addEventListener('click',async()=>{if(!confirm('Obrisati ovaj unos?'))return;if(current==='students'){data.students.splice(index,1);}else if(current==='users'){if(!entry.id){alert('Ovaj nalog nema ID na serveru.');return;}try{const response=await fetch(`/api/korisnici/${entry.id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${localStorage.getItem('ednevnik-token')||''}`}});const result=await response.json();if(!response.ok)throw new Error(result.greska||'Brisanje nije uspelo.');data.users.splice(index,1);}catch(error){alert(error.message);return;}}else data[current].splice(index,1);save();render();});li.append(text,remove);list.appendChild(li);});}
document.querySelectorAll('.category').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.category').forEach(item=>item.classList.remove('active'));button.classList.add('active');current=button.dataset.kind;render();}));
form.addEventListener('submit',async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(form));if(current==='students'){const id=values.name.toLocaleLowerCase('sr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(data.students.some(student=>student.id===id)){alert('Učenik sa ovim imenom je već unet.');return;}data.students.push({id,name:values.name.trim(),className:values.className,photo:'',grades:[],notes:[],conduct:[],absences:[],details:{}});}else if(current==='users'){try{const response=await fetch('/api/korisnici',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${localStorage.getItem('ednevnik-token')||''}`},body:JSON.stringify({ime:values.name,korisnicko_ime:values.username,lozinka:values.password,uloga:values.role,email:values.email,telefon:values.phone})});const result=await response.json();if(!response.ok)throw new Error(result.greska||'Nije moguće dodati korisnika.');data.users.push({id:result.id,name:values.name,username:values.username,role:values.role,email:values.email,phone:values.phone});}catch(error){alert(error.message+' Proverite da li je serverski API dostupan.');return;}}else if(current==='subjects'||current==='classes'){if(data[current].includes(values.name.trim())){alert('Ovaj unos već postoji.');return;}data[current].push(values.name.trim());}else data.schools.push(values.name.trim());save();render();});render();
</script>
<script src="common-header.js"></script>
</body>
</html>
